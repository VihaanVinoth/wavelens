<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveLens</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="map"></div>
    <aside id="radar-hud">
        <header class="hud-header">
            <div class="hud-brand">
                <div>
                    <div class="hud-brand-name">WaveLens</div>
                </div>
            </div>
            <button id="theme-toggle" class="map-control-btn" type="button" aria-label="Toggle theme" title="Toggle Theme" style="width: 30px; height: 30px; font-size: 14px; margin-left: auto; margin-right: 8px; border-radius: 7px; border: 1px solid var(--border);">
                🌓
            </button>
            <div class="status">
                <span id="status-dot" class="status-dot"></span>
                <span id="connection-status">CONNECTING</span>
            </div>
        </header>
        <section class="hud-frequency-section">
            <div>
                <div class="frequency-label">Active Frequency</div>
                <div class="freq-group">
                    <span id="freq-display" class="freq-val">14.074</span>
                    <span class="freq-unit">MHz</span>
                </div>
            </div>
            <div class="hud-stat-group">
                <div class="stat-label">Active Spots: <strong id="stat-count">0</strong></div>
                <div class="meter-track">
                    <div class="meter-bar" style="width: 65%;"></div>
                </div>
            </div>
        </section>
        <section class="band-section">
            <div class="section-label">Bands</div>
            <div class="band-matrix">
                <button class="band-btn" data-band="160m" type="button">160M</button>
                <button class="band-btn" data-band="80m" type="button">80M</button>
                <button class="band-btn" data-band="40m" type="button">40M</button>
                <button class="band-btn active" data-band="20m" type="button">20M</button>
                <button class="band-btn" data-band="15m" type="button">15M</button>
                <button class="band-btn" data-band="10m" type="button">10M</button>
                <button class="band-btn" data-band="6m" type="button">6M</button>
                <button class="band-btn" data-band="2m" type="button">2M</button>
            </div>
        </section>
        <div class="spots-toolbar">
            <span class="spots-title">Live Feed</span>
            <time id="utc-clock">00:00:00 UTC</time>
        </div>
        <div class="search-wrapper">
            <input id="callsign-filter" type="text" placeholder="Filter by callsign, mode, freq..." autocomplete="off">
        </div>
        <div id="spots-list"></div>
    </aside>
    <div class="map-controls">
        <button id="zoom-in" class="map-control-btn" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-out" class="map-control-btn" type="button" aria-label="Zoom out">-</button>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        window.WAVELENS_CONFIG = {
            hub: {
                lat: -38.21,
                lon: 145.11,
                callsign: "LOCAL"
            }
        };
    </script>
    <script src="static/js/app.js"></script>
</body>
</html>
