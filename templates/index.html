<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WaveLens - Amateur Radio Telemetry Console</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>WaveLens Telemetry Console</h1>
        <div class="controls">
            <select id="band-select" onchange="loadSpots()">
                <option value="20m">20m Band</option>
                <option value="40m">40m Band</option>
                <option value="30m">30m Band</option>
                <option value="15m">15m Band</option>
                <option value="10m">10m Band</option>
                <option value="80m">80m Band</option>
            </select>
            <div id="status-badge" class="badge">Loading spots...</div>
        </div>
    </header>

    <main>
        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let linesLayer = L.layerGroup().addTo(map);

        function loadSpots() {
            const band = document.getElementById('band-select').value;
            document.getElementById('status-badge').innerText = `Fetching ${band}...`;
            
            fetch(`/api/spots?band=${band}`)
                .then(res => res.json())
                .then(spots => {
                    linesLayer.clearLayers();
                    document.getElementById('status-badge').innerText = `Loaded ${spots.length} spots (${band})`;
                    
                    spots.forEach(spot => {
                        const latlngs = [
                            [spot.lat1, spot.lon1],
                            [spot.lat2, spot.lon2]
                        ];
                        const polyline = L.polyline(latlngs, {color: '#00ffcc', weight: 1, opacity: 0.6});
                        polyline.bindPopup(`<b>${spot.sender}</b> → <b>${spot.receiver}</b><br>SNR: ${spot.snr} dB<br>Mode: ${spot.mode}`);
                        linesLayer.addLayer(polyline);
                    });
                })
                .catch(err => {
                    console.error("Error loading spots:", err);
                    document.getElementById('status-badge').innerText = 'Error loading feed';
                });
        }

        loadSpots();
        setInterval(loadSpots, 60000);
    </script>
</body>
</html>
